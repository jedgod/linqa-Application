apiVersion: apps/v1
kind: Deployment
metadata:
  name: linqa-api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: linqa-api
  template:
    metadata:
      labels:
        app: linqa-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/jedgod/linqa-application-api@sha256:REPLACE_WITH_SIGNED_DIGEST
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: linqa-api-secrets
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
          startupProbe:
            httpGet:
              path: /health/live
              port: 8080
            failureThreshold: 30
            periodSeconds: 2
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: linqa-api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: linqa-api
---
apiVersion: v1
kind: Service
metadata:
  name: linqa-api
spec:
  selector:
    app: linqa-api
  ports:
    - name: http
      port: 80
      targetPort: 8080
