apiVersion: apps/v1
kind: Deployment
metadata:
  name: linqa-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: linqa-api
  template:
    metadata:
      labels:
        app: linqa-api
    spec:
      containers:
        - name: api
          image: ghcr.io/linqa/linqa-api:REPLACE_WITH_SIGNED_DIGEST
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: linqa-api-secrets
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi