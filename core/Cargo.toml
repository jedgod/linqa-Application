[package]
name = "linqa-core"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "linqa_core"
crate-type = ["cdylib", "staticlib", "rlib"]  # FFI-friendly for future mobile/desktop bindings

[features]
default = []
uniffi-bindings = ["dep:uniffi"]
uniffi-cli = ["uniffi-bindings", "uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["uniffi-cli"]

[dependencies]
argon2 = "0.5"
base64 = "0.22"
bincode = { version = "2", features = ["serde"] }
blake3 = "1"
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core", "serde"] }
hkdf = "0.12"
hmac = "0.12"
ml-kem = { version = "0.3", features = ["getrandom"] }
postcard = { version = "1", features = ["alloc"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde-big-array = "0.5"
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde", "js"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = { version = "1", features = ["zeroize_derive"] }
uniffi = { version = "0.29", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
proptest = "1"
