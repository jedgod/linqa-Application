[package]
name = "linqa-implementations"
version = "0.1.0"
edition = "2021"
description = "Stepwise implementations of Linqa priority gaps"
publish = false

[dependencies]
chacha20poly1305 = "0.10"
hkdf = "0.12"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = { version = "1.7", features = ["derive"] }
hex = "0.4"
thiserror = "1"
anyhow = "1"

[dev-dependencies]
tempfile = "3"
