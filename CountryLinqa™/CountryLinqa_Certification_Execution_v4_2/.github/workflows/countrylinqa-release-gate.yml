name: CountryLinqa Release Gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "server/src/services/countrylinqa/**"
      - "server/src/routes/countrylinqa/**"
      - "server/src/tests/countrylinqa*"
      - "clients/mobile/app/countrylinqa/**"
      - "clients/mobile/services/countrylinqa*"
      - "scripts/countrylinqa*"

jobs:
  certification:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: linqa
          POSTGRES_PASSWORD: linqa_ci
          POSTGRES_DB: linqa_countrylinqa_ci_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U linqa -d linqa_countrylinqa_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://linqa:linqa_ci@127.0.0.1:5432/linqa_countrylinqa_ci_test
      REDIS_URL: redis://127.0.0.1:6379
      LINQA_REQUIRE_DB_TESTS: "1"
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            clients/mobile/package-lock.json

      - name: Install server
        run: npm ci
        working-directory: server

      - name: Install mobile
        run: npm ci
        working-directory: clients/mobile

      - name: Dedicated DB guard
        run: node scripts/assert-dedicated-test-db.mjs

      - name: Apply migrations
        run: npm run db:migrate
        working-directory: server

      - name: Migration idempotency
        run: npm run db:migrate
        working-directory: server

      - name: Reject explicit skips/only
        run: node scripts/audit-vitest-skips.mjs

      - name: Server build
        run: npm run build
        working-directory: server

      - name: Mobile typecheck
        run: npm run typecheck
        working-directory: clients/mobile

      - name: DB certification tests
        run: node scripts/countrylinqa-db-test-gate.mjs

      - name: Full server suite
        run: npm test
        working-directory: server

      - name: Existing CountryLinqa certification
        run: node scripts/countrylinqa-certification.mjs --software-only

      - name: Upload certification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: countrylinqa-certification-${{ github.sha }}
          path: |
            certification/countrylinqa/**
            server/test-results/**
          if-no-files-found: warn
