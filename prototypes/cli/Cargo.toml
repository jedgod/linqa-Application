[package]
name = "linqa-cli"
version = "0.1.0"
edition = "2021"
description = "Simple CLI prototype that exercises linqa-core traits"
publish = false

[[bin]]
name = "linqa"
path = "src/main.rs"

[dependencies]
linqa-core = { path = "../../core" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
hex = "0.4"
serde_json = "1"
