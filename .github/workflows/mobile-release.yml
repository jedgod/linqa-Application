name: Linqa Mobile Release

on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        options: [android, ios]
        required: true
      channel:
        type: choice
        options: [internal, beta, production]
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  android:
    if: ${{ inputs.platform == 'android' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: clients/mobile
      - run: npx expo-doctor
        working-directory: clients/mobile
      - run: npx tsc --noEmit
        working-directory: clients/mobile
      - name: Require EAS authentication
        env: { EXPO_TOKEN: "${{ secrets.EXPO_TOKEN }}" }
        run: test -n "$EXPO_TOKEN"
      - name: Start signed Android build
        env: { EXPO_TOKEN: "${{ secrets.EXPO_TOKEN }}" }
        working-directory: clients/mobile
        run: npx eas-cli build --platform android --profile "${{ inputs.channel }}" --non-interactive --no-wait

  ios:
    if: ${{ inputs.platform == 'ios' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: clients/mobile
      - run: npx expo-doctor
        working-directory: clients/mobile
      - run: npx tsc --noEmit
        working-directory: clients/mobile
      - name: Require EAS authentication
        env: { EXPO_TOKEN: "${{ secrets.EXPO_TOKEN }}" }
        run: test -n "$EXPO_TOKEN"
      - name: Start signed iOS build
        env: { EXPO_TOKEN: "${{ secrets.EXPO_TOKEN }}" }
        working-directory: clients/mobile
        run: npx eas-cli build --platform ios --profile "${{ inputs.channel }}" --non-interactive --no-wait
