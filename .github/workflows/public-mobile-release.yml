name: Linqa Public Mobile Release

on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        options: [android, ios]
        required: true
      rollout:
        type: choice
        options: ["1","5","10","25","50","100"]
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require production readiness
        env: { LINQA_API_BASE_URL: "${{ secrets.LINQA_API_BASE_URL }}" }
        run: |
          test -n "$LINQA_API_BASE_URL"
          curl --fail --silent --show-error "$LINQA_API_BASE_URL/v1/runtime/final-readiness" | jq -e '.ready == true'

  android:
    needs: preflight
    if: ${{ inputs.platform == 'android' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: clients/mobile
      - run: npx expo-doctor
        working-directory: clients/mobile
      - run: npx tsc --noEmit
        working-directory: clients/mobile
      - name: Build, sign, and submit Android release
        env: { EXPO_TOKEN: "${{ secrets.EXPO_TOKEN }}" }
        working-directory: clients/mobile
        run: |
          test -n "$EXPO_TOKEN"
          npx eas-cli build --platform android --profile production --auto-submit --non-interactive
      - name: Record requested staged rollout
        run: echo "Requested Play staged rollout is ${{ inputs.rollout }}%; release operator must confirm it in Play Console evidence."

  ios:
    needs: preflight
    if: ${{ inputs.platform == 'ios' }}
    runs-on: macos-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: clients/mobile
      - run: npx expo-doctor
        working-directory: clients/mobile
      - run: npx tsc --noEmit
        working-directory: clients/mobile
      - name: Build, sign, and submit iOS release
        env: { EXPO_TOKEN: "${{ secrets.EXPO_TOKEN }}" }
        working-directory: clients/mobile
        run: |
          test -n "$EXPO_TOKEN"
          npx eas-cli build --platform ios --profile production --auto-submit --non-interactive
      - name: Record requested phased rollout
        run: echo "Requested App Store phased rollout is ${{ inputs.rollout }}%; release operator must confirm it in App Store evidence."
