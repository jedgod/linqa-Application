name: Linqa CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust core
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Require lockfile
        run: cargo metadata --locked --no-deps --format-version 1

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-features --locked

  server:
    name: Server
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: linqa_test
          POSTGRES_USER: linqa
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U linqa -d linqa_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      minio:
        image: adobe/s3mock:latest
        env:
          initialBuckets: linqa-test
        ports:
          - 9090:9090
    defaults:
      run:
        working-directory: server
    env:
      NODE_ENV: test
      LINQA_REQUIRE_DB_TESTS: "1"
      DATABASE_URL: postgresql://linqa:test_password@127.0.0.1:5432/linqa_test
      JWT_ISSUER: https://test.linqa.local
      JWT_AUDIENCE: linqa-api
      JWT_HS256_SECRET: test-secret-that-is-at-least-32-bytes-long
      CONTACT_DISCOVERY_SECRET: test-secret-that-is-at-least-32-bytes-2
      TOKEN_VAULT_KEY_BASE64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      TURN_SHARED_SECRET: test-turn-secret-that-is-at-least-32-bytes
      TURN_URLS: turn:127.0.0.1:3478?transport=udp
      CORS_ORIGINS: http://127.0.0.1:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run db:migrate
      - name: Verify migration ledger and idempotent upgrade replay
        run: npm run db:migrate
      - name: Install mobile encryption dependencies
        working-directory: clients/mobile
        run: npm ci --ignore-scripts
      - run: npm test
      # These six files (wallet custody, money flows, fee refunds, idempotency, invoice payment, modules) skip unless
      # LINQA_WALLET_DISPOSABLE_TEST_DB=1, because they wipe wallet tables. The runner creates a uniquely named
      # throwaway database on this service container, runs them serially, proves a migration replay leaves ledger
      # postings unchanged, then drops the database. Without this step none of them ever ran in CI.
      - name: Wallet, ledger and idempotency integration (disposable database)
        run: npm run linqasend:test:wallet:db
      - name: Chat security boundary regressions
        run: npm run test:security:chat
      - name: Mobile key-protection regressions
        working-directory: .
        run: node --import ./server/node_modules/tsx/dist/loader.mjs --test tests/messaging-gate-security.test.ts tests/secure-core.test.ts
      - name: Offline metadata encryption and audit verifier regressions
        run: npm run test:encryption
      - run: npm run build

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clients/web/package-lock.json

      - run: npm ci
      - name: Install mobile dependencies (web tests import shared mobile messaging code)
        working-directory: clients/mobile
        run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run test -- --run
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: linqa-web-dist
          path: clients/web/dist
          if-no-files-found: error

  protocol-fixtures:
    name: Protocol fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify protocol fixtures
        run: |
          test -d tests/protocol-fixtures
          find tests/protocol-fixtures -type f -name '*.json' -print
