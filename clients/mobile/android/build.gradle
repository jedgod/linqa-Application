// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

// Keep native staging paths short on Windows. This survives npm reinstalls,
// unlike edits inside dependency build.gradle files. The staging root sits outside the repo because the autolinked
// codegen object paths embed the full source path and overflow MAX_PATH even from <repo>/.runtime.
if (System.getProperty('os.name').toLowerCase().contains('windows')) {
  subprojects { nativeProject ->
    def shortName = ['react-native-reanimated': 'rea', 'react-native-worklets': 'work', 'app': 'app'][nativeProject.name]
    if (shortName != null) {
      ['com.android.library', 'com.android.application'].each { pluginId ->
        nativeProject.plugins.withId(pluginId) {
          nativeProject.extensions.getByName('androidComponents').finalizeDsl { androidDsl ->
            androidDsl.externalNativeBuild.cmake.buildStagingDirectory = new File(System.getenv('LINQA_CXX_ROOT') ?: 'C:/lq/cxx', shortName).canonicalFile
          }
        }
      }
    }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"

