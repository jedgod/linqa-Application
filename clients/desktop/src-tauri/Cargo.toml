[package]
name = "linqa-desktop"
version = "0.1.0"
description = "Linqa desktop client (Tauri) — scaffolding only"
authors = ["Linqa Project"]
edition = "2021"
publish = false

[lib]
name = "linqa_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "linqa-desktop"
path = "src/main.rs"

[build-dependencies]
# tauri-build = { version = "2", features = [] }

[dependencies]
# linqa-core = { path = "../../../core" }
# tauri = { version = "2", features = [] }
# serde = { version = "1", features = ["derive"] }
# serde_json = "1"

# Scaffolding only — real Tauri + linqa-core dependencies will be enabled
# once the core is buildable and the project leaves pure design phase.
