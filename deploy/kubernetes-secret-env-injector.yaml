# Render the certified image and provision referenced objects before deployment.
# This maps existing Secrets; it does not provision a cloud vault or KMS key.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: linqasend-wallet-worker
  namespace: linqa-production
spec:
  # Release operators enable money and scale only after production gates pass.
  replicas: 0
  selector:
    matchLabels:
      app: linqasend-wallet-worker
  template:
    metadata:
      labels:
        app: linqasend-wallet-worker
    spec:
      serviceAccountName: linqasend-wallet-worker
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: subledger-engine
          image: ghcr.io/jedgod/linqa-application-api:REPLACE_WITH_CERTIFIED_TAG
          imagePullPolicy: Always
          command: ["node", "dist/jobs/linqasend-workers.js"]
          envFrom:
            # Full production loadConfig requirements, including DATABASE_URL,
            # JWT keys and exact certified release/artifact identifiers.
            - secretRef:
                name: linqasend-server-runtime
          env:
            - name: NODE_ENV
              value: production
            - name: LINQASEND_REAL_MONEY_ENABLED
              value: "false"
            - name: LINQASEND_PROVIDER_URL
              valueFrom:
                secretKeyRef:
                  name: wallet-kms-gateway-secrets
                  key: provider-url
            - name: LINQASEND_PROVIDER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: wallet-kms-gateway-secrets
                  key: provider-bearer-token
            - name: LINQASEND_TOKEN_KMS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: wallet-kms-gateway-secrets
                  key: kms-key-id
            - name: LINQASEND_TOKEN_KMS_REGION
              valueFrom:
                secretKeyRef:
                  name: wallet-kms-gateway-secrets
                  key: kms-region
            - name: LINQASEND_CUSTODY_MANIFEST_PATH
              value: /etc/secure/custody-accounts.json
          volumeMounts:
            - name: secure-manifest-volume
              mountPath: /etc/secure
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: secure-manifest-volume
          secret:
            secretName: wallet-custody-manifest-json
            defaultMode: 0440
            items:
              - key: custody-accounts.json
                path: custody-accounts.json
